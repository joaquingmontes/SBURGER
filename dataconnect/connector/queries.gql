query GetUsuarioByEmail($email: String!) @auth(level: PUBLIC, insecureReason: "Login custom pendiente de Auth") {
  usuarios(where: { email: { eq: $email } }, limit: 1) {
    id
    nombreCompleto
    email
    passwordHash
    rol
  }
}

query GetProductoById($id: UUID!) @auth(level: PUBLIC, insecureReason: "Catalogo publico del menu") {
  productos(where: { id: { eq: $id } }, limit: 1) {
    id
    nombre
    descripcion
    ingredientes
    precio
    categoria
    imagenUrl
  }
}
