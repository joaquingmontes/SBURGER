query ListProductosActivos @auth(level: PUBLIC, insecureReason: "Catalogo publico del menu") {
  productos(where: { activo: { eq: true } }) {
    id
    nombre
    descripcion
    ingredientes
    precio
    categoria
    imagenUrl
  }
}

query ListProductosAdmin @auth(level: PUBLIC, insecureReason: "Pendiente restringir acceso admin") {
  productos(orderBy: { createdAt: DESC }) {
    id
    nombre
    descripcion
    ingredientes
    precio
    categoria
    imagenUrl
    activo
  }
}

query ListPedidosByUsuario($usuarioId: UUID!) @auth(level: PUBLIC, insecureReason: "Pendiente integrar Firebase Auth") {
  pedidos(where: { usuario: { id: { eq: $usuarioId } } }, orderBy: { createdAt: DESC }) {
    id
    codigo
    estado
    subtotal
    costoEnvio
    total
    modalidadEntrega
    nombreContacto
    telefonoContacto
    direccion
    createdAt
    pedidoItems_on_pedido {
      id
      nombreProducto
      cantidad
      precioUnitario
      precioTotalLinea
      extraMedallon
      extraCheddar
      extraPanceta
      extraCebolla
      notas
    }
  }
}

