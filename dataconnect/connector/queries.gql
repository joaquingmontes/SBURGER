query GetMe @auth(level: USER) {
  usuarios(where: { authUid: { eq_expr: "auth.uid" } }, limit: 1) {
    id
    nombreCompleto
    email
    rol
  }
}

query GetProductoById($id: UUID!) @auth(level: PUBLIC, insecureReason: "Catalogo publico del menu") {
  productos(where: { id: { eq: $id } }, limit: 1) {
    id
    nombre
    descripcion
    ingredientes
    precio
    categoria
    imagenUrl
  }
}

query ListSucursales @auth(level: PUBLIC, insecureReason: "Listado publico de sucursales") {
  sucursals(orderBy: { nombre: ASC }) {
    id
    nombre
    direccion
  }
}
