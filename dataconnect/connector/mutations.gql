) @auth(level: USER) {
  pedidoItem_insert(
    data: {
      pedidoId: $pedidoId
      productoId: $productoId
      nombreProducto: $nombreProducto
      cantidad: $cantidad
      precioUnitario: $precioUnitario
      precioTotalLinea: $precioTotalLinea
      extraMedallon: $extraMedallon
      extraCheddar: $extraCheddar
      extraPanceta: $extraPanceta
      extraCebolla: $extraCebolla
      notas: $notas
    }
  )
}

mutation UpdatePedidoEstado($id: UUID!, $estado: EstadoPedido!) @auth(level: USER) {
  pedido_update(id: $id, data: { estado: $estado })
}

mutation CreateSucursal($nombre: String!, $direccion: String!) @auth(level: USER) {
  sucursal_insert(data: { nombre: $nombre, direccion: $direccion })
}

mutation CreateProductoSucursal(
  $productoId: UUID!
  $sucursalId: UUID!
  $precio: Int!
) @auth(level: USER) {
  productoSucursal_insert(
    data: {
      productoId: $productoId
      sucursalId: $sucursalId
      precio: $precio
    }
  )
}

mutation UpdateProductoSucursal($id: UUID!, $precio: Int!) @auth(level: USER) {
  productoSucursal_update(id: $id, data: { precio: $precio })
}
