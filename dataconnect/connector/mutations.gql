mutation CreateUsuarioProfile(
  $nombreCompleto: String!
  $email: String!
  $rol: RolUsuario
) @auth(level: USER) {
  usuario_insert(
    data: {
      nombreCompleto: $nombreCompleto
      email: $email
      authUid_expr: "auth.uid"
      rol: $rol
    }
  )
}

mutation LinkMyAccount @auth(level: USER) {
  usuario_update(
    first: {
      where: {
        email: { eq_expr: "auth.token.email" }
        authUid: { eq: null }
      }
    }
    data: {
      authUid_expr: "auth.uid"
    }
  )
}

mutation CreateProducto(
  $nombre: String!
  $descripcion: String!
  $ingredientes: String
  $precio: Int!
  $categoria: CategoriaProducto!
  $imagenUrl: String!
) @auth(level: USER) {
  producto_insert(
    data: {
      nombre: $nombre
      descripcion: $descripcion
      ingredientes: $ingredientes
      precio: $precio
      categoria: $categoria
      imagenUrl: $imagenUrl
    }
  )
}

mutation UpdateProducto(
  $id: UUID!
  $nombre: String!
  $descripcion: String!
  $ingredientes: String
  $precio: Int!
  $categoria: CategoriaProducto!
  $imagenUrl: String!
) @auth(level: USER) {
  producto_update(
    id: $id
    data: {
      nombre: $nombre
      descripcion: $descripcion
      ingredientes: $ingredientes
      precio: $precio
      categoria: $categoria
      imagenUrl: $imagenUrl
    }
  )
}

mutation DeleteProducto($id: UUID!) @auth(level: USER) {
  producto_update(id: $id, data: { activo: false })
}

mutation CreatePedido(
  $codigo: String!
  $usuarioId: UUID!
  $sucursalId: UUID!
  $subtotal: Int!
  $costoEnvio: Int!
  $total: Int!
  $modalidadEntrega: ModalidadEntrega!
  $nombreContacto: String!
  $telefonoContacto: String!
  $direccion: String
) @auth(level: USER) {
  pedido_insert(
    data: {
      codigo: $codigo
      usuarioId: $usuarioId
      sucursalId: $sucursalId
      subtotal: $subtotal
      costoEnvio: $costoEnvio
      total: $total
      modalidadEntrega: $modalidadEntrega
      nombreContacto: $nombreContacto
      telefonoContacto: $telefonoContacto
      direccion: $direccion
    }
  )
}

